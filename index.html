    // --- HIGH-PRECISION REALISTIC QR CODE COMPONENT ---
    function BetterQRCode({ value = "CV-PASS", size = 140, className = "" }) {
      const dots = useMemo(() => {
        let seed = 0;
        for (let i = 0; i < value.length; i++) seed = (seed << 5) - seed + value.charCodeAt(i);
        seed = Math.abs(seed) || 98765;

        const grid = [];
        const sizeN = 21;
        for (let r = 0; r < sizeN; r++) {
          for (let c = 0; c < sizeN; c++) {
            const isTL = r < 7 && c < 7;
            const isTR = r < 7 && c > 13;
            const isBL = r > 13 && c < 7;
            const isCenterLogo = r >= 8 && r <= 12 && c >= 8 && c <= 12;

            if (!isTL && !isTR && !isBL && !isCenterLogo) {
              seed = (seed * 1664525 + 1013904223) % 4294967296;
              if (seed % 100 < 55) {
                grid.push({ r, c, gold: seed % 7 === 0 });
              }
            }
          }
        }
        return grid;
      }, [value]);

      return (
        <div className={`relative bg-white p-2 rounded-xl border border-brand-gold/50 shadow-lg ${className}`} style={{ width: size, height: size }}>
          <svg viewBox="0 0 210 210" className="w-full h-full">
            <rect width="210" height="210" fill="#FFFFFF" rx="8" />

            <rect x="10" y="10" width="60" height="60" rx="8" fill="#0B0B0F" />
            <rect x="20" y="20" width="40" height="40" rx="4" fill="#FFFFFF" />
            <rect x="30" y="30" width="20" height="20" rx="2" fill="#F5C451" />

            <rect x="140" y="10" width="60" height="60" rx="8" fill="#0B0B0F" />
            <rect x="150" y="20" width="40" height="40" rx="4" fill="#FFFFFF" />
            <rect x="160" y="30" width="20" height="20" rx="2" fill="#F5C451" />

            <rect x="10" y="140" width="60" height="60" rx="8" fill="#0B0B0F" />
            <rect x="20" y="150" width="40" height="40" rx="4" fill="#FFFFFF" />
            <rect x="30" y="160" width="20" height="20" rx="2" fill="#F5C451" />

            {dots.map((d, i) => (
              <rect
                key={i}
                x={d.c * 10}
                y={d.r * 10}
                width="8.5"
                height="8.5"
                rx="1.5"
                fill={d.gold ? "#F5C451" : "#0B0B0F"}
              />
            ))}

            <rect x="80" y="80" width="50" height="50" rx="8" fill="#0B0B0F" stroke="#F5C451" strokeWidth="3" />
            <text x="105" y="112" fill="#F5C451" fontSize="18" fontWeight="900" textAnchor="middle" fontFamily="Outfit">OG</text>
          </svg>
        </div>
      );
    }

    // --- DOWNLOAD DIGITAL TICKET PNG IMAGE DIRECTLY TO SYSTEM ---
    function downloadTicketAsImage(ticket) {
      if (!ticket) return;
      const canvas = document.createElement("canvas");
      canvas.width = 700;
      canvas.height = 950;
      const ctx = canvas.getContext("2d");

      // Dark Background
      ctx.fillStyle = "#0B0B0F";
      ctx.fillRect(0, 0, 700, 950);

      // Gold Border
      ctx.strokeStyle = "#F5C451";
      ctx.lineWidth = 6;
      ctx.strokeRect(15, 15, 670, 920);

      // Header Gradient
      const grad = ctx.createLinearGradient(15, 15, 685, 15);
      grad.addColorStop(0, "#F5C451");
      grad.addColorStop(0.5, "#E5B33C");
      grad.addColorStop(1, "#F59E0B");
      ctx.fillStyle = grad;
      ctx.fillRect(15, 15, 670, 100);

      // Header Text
      ctx.fillStyle = "#0B0B0F";
      ctx.font = "900 28px sans-serif";
      ctx.fillText("CINEVERSE OFFICIAL DIGITAL TICKET", 35, 60);
      ctx.font = "bold 16px monospace";
      ctx.fillText(`REF ID: ${ticket.id}`, 35, 90);

      // Details
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "800 30px sans-serif";
      ctx.fillText(ticket.movieTitle, 35, 165);

      ctx.fillStyle = "#CBD5E1";
      ctx.font = "16px sans-serif";
      ctx.fillText(ticket.theatre, 35, 200);

      ctx.fillStyle = "#F5C451";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`Showtime: ${ticket.date} • ${ticket.showtime}`, 35, 240);

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`Allocated Seats: ${ticket.seats.join(", ")}`, 35, 280);

      ctx.fillStyle = "#34D399";
      ctx.font = "bold 18px sans-serif";
      ctx.fillText(`Amount Paid: ₹${ticket.grandTotal}`, 35, 320);

      // Divider Line
      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(35, 360);
      ctx.lineTo(665, 360);
      ctx.stroke();
      ctx.setLineDash([]);

      // QR Code Base
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(230, 400, 240, 240);

      const drawFinder = (x, y) => {
        ctx.fillStyle = "#0B0B0F";
        ctx.fillRect(x, y, 60, 60);
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(x + 10, y + 10, 40, 40);
        ctx.fillStyle = "#F5C451";
        ctx.fillRect(x + 20, y + 20, 20, 20);
      };
      drawFinder(250, 420);
      drawFinder(390, 420);
      drawFinder(250, 560);

      let seed = 98765;
      for (let r = 0; r < 14; r++) {
        for (let c = 0; c < 14; c++) {
          if ((r < 4 && c < 4) || (r < 4 && c > 9) || (r > 9 && c < 4)) continue;
          seed = (seed * 9301 + 49297) % 233280;
          if (seed % 2 === 0) {
            ctx.fillStyle = seed % 7 === 0 ? "#F5C451" : "#0B0B0F";
            ctx.fillRect(250 + c * 15, 420 + r * 15, 12, 12);
          }
        }
      }

      ctx.fillStyle = "#0B0B0F";
      ctx.fillRect(325, 495, 50, 50);
      ctx.strokeStyle = "#F5C451";
      ctx.lineWidth = 3;
      ctx.strokeRect(325, 495, 50, 50);
      ctx.fillStyle = "#F5C451";
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("OG", 350, 528);

      // Footer text
      ctx.fillStyle = "#94A3B8";
      ctx.font = "14px monospace";
      ctx.textAlign = "center";
      ctx.fillText("OG's Cinema Official Admission Pass — Valid at all India Gate Terminals", 350, 700);
      ctx.fillText(`Issued: ${new Date().toLocaleDateString()} • Verified Encrypted Ticket`, 350, 730);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        ctx.drawImage(img, 520, 150, 140, 190);
        triggerDownload();
      };
      img.onerror = () => {
        triggerDownload();
      };
      img.src = ticket.poster;

      function triggerDownload() {
        const link = document.createElement("a");
        link.download = `CineVerse_Ticket_${ticket.id}.png`;
        link.href = canvas.toDataURL("image/png");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    // --- DYNAMIC BOOKMYSHOW UPCOMING 5 DAYS GENERATOR ---
    function getUpcoming5Days() {
      const days = [];
      const today = new Date();
      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      for (let i = 0; i < 5; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dayStr = i === 0 ? "Today" : i === 1 ? "Tomorrow" : dayNames[d.getDay()];
        const formatted = `${dayStr}, ${monthNames[d.getMonth()]} ${d.getDate()}`;
        days.push(formatted);
      }
      return days;
    }

    // --- DYNAMIC FULL 30-DAY MONTH CALENDAR LIST GENERATOR ---
    function getUpcoming30Days() {
      const days = [];
      const today = new Date();
      const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      for (let i = 0; i < 30; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dayStr = i === 0 ? "Today" : i === 1 ? "Tomorrow" : dayNames[d.getDay()];
        const formatted = `${dayStr}, ${monthNames[d.getMonth()]} ${d.getDate()}`;
        days.push(formatted);
      }
      return days;
    }

    // --- SMART MULTI-PATH IMAGE FALLBACK HANDLER FOR GITHUB PAGES ---
    function handleImageError(e) {
      const img = e.target;
      if (!img.dataset.tryStep) img.dataset.tryStep = "1";
      const step = parseInt(img.dataset.tryStep, 10);
      const rawSrc = img.getAttribute("src") || "";

      if (step === 1) {
        img.dataset.tryStep = "2";
        img.src = "./" + rawSrc.replace(/^\.\//, "");
      } else if (step === 2) {
        img.dataset.tryStep = "3";
        if (rawSrc.endsWith(".jpg")) {
          img.src = rawSrc.replace(/\.jpg$/, ".png");
        } else if (rawSrc.endsWith(".png")) {
          img.src = rawSrc.replace(/\.png$/, ".jpg");
        } else {
          img.src = rawSrc + ".png";
        }
      } else if (step === 3) {
        img.dataset.tryStep = "4";
        const filename = rawSrc.split("/").pop();
        img.src = filename;
      } else if (step === 4) {
        img.dataset.tryStep = "5";
        const filename = rawSrc.split("/").pop();
        if (filename.startsWith("poster_")) {
          img.src = "images/" + filename.replace("poster_", "");
        } else {
          img.src = "images/poster_" + filename;
        }
      } else {
        img.onerror = null;
        img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450' viewBox='0 0 300 450'><rect width='300' height='450' fill='%23161622'/><rect x='12' y='12' width='276' height='426' rx='16' fill='%230B0B0F' stroke='%23F5C451' stroke-width='2'/><circle cx='150' cy='180' r='45' fill='none' stroke='%23F5C451' stroke-width='4'/><text x='150' y='270' fill='%23F5C451' font-size='22' font-weight='900' text-anchor='middle' font-family='sans-serif'>CINEVERSE</text><text x='150' y='300' fill='%23FFFFFF' font-size='14' font-weight='700' text-anchor='middle' font-family='sans-serif'>OFFICIAL POSTER</text></svg>";
      }
    }

    // --- DYNAMIC SEEDED FISHER-YATES RANDOM BOOKED SEATS GENERATOR ---
    function generateBookedSeats(theatreId, showtime, date) {
      const seedStr = `${theatreId || 't1'}_${showtime || '10:00'}_${date || 'Today'}`;
      let hash = 0;
      for (let i = 0; i < seedStr.length; i++) {
        hash = (hash << 5) - hash + seedStr.charCodeAt(i);
        hash |= 0;
      }
      
      const rowLabels = ["A", "B", "C", "D", "E", "F", "G", "H"];
      const allSeats = [];
      for (const r of rowLabels) {
        for (let c = 1; c <= 10; c++) {
          allSeats.push(`${r}${c}`);
        }
      }

      let currentSeed = Math.abs(hash) || 12345;
      const prng = () => {
        currentSeed = (currentSeed * 1664525 + 1013904223) % 4294967296;
        return currentSeed / 4294967296;
      };

      for (let i = allSeats.length - 1; i > 0; i--) {
        const j = Math.floor(prng() * (i + 1));
        [allSeats[i], allSeats[j]] = [allSeats[j], allSeats[i]];
      }

      const count = 14 + Math.floor(prng() * 15);
      return allSeats.slice(0, count);
    }

          { label: "A", tier: "STANDARD" },
          { label: "B", tier: "STANDARD" },
          { label: "C", tier: "EXECUTIVE" },
          { label: "D", tier: "EXECUTIVE" },
          { label: "E", tier: "PREMIUM" },
          { label: "F", tier: "PREMIUM" },
          { label: "G", tier: "VIP" },
          { label: "H", tier: "VIP" },
        ];
        const tId = bookingTheatre ? bookingTheatre.id : "t1";
        const booked = generateBookedSeats(tId, bookingTime, bookingDate);
        return { rows, booked };
      }, [bookingTheatre, bookingTime, bookingDate]);

      // --- AUTO SEAT ALLOCATION ENGINE FOR MULTIPLE PEOPLE ---
      const toggleSeatWithQuantity = (clickedSeatId) => {
        if (seatData.booked.includes(clickedSeatId)) return;

        // If clicked seat is already selected, clear current selection
        if (selectedSeats.includes(clickedSeatId)) {
          setSelectedSeats([]);
          return;
        }

        const rowLabel = clickedSeatId.charAt(0);
        const startCol = parseInt(clickedSeatId.substring(1), 10);
        const qty = ticketQuantity;

        if (qty === 1) {
          setSelectedSeats([clickedSeatId]);
          return;
        }

        // 1. Try picking `qty` consecutive seats going right starting from clickedSeatId
        const rightGroup = [];
        for (let c = startCol; c <= 10 && rightGroup.length < qty; c++) {
          const sId = `${rowLabel}${c}`;
          if (!seatData.booked.includes(sId)) {
            rightGroup.push(sId);
          } else {
            break;
          }
        }
        if (rightGroup.length === qty) {
          setSelectedSeats(rightGroup);
          return;
        }

        // 2. Try picking `qty` consecutive seats ending around clickedSeatId
        for (let s = Math.max(1, startCol - qty + 1); s <= startCol; s++) {
          const candidate = [];
          for (let c = s; c < s + qty && c <= 10; c++) {
            const sId = `${rowLabel}${c}`;
            if (!seatData.booked.includes(sId)) {
              candidate.push(sId);
            } else {
              break;
            }
          }
          if (candidate.length === qty) {
            setSelectedSeats(candidate);
            return;
          }
        }

        // 3. Fallback: Pick nearest available unbooked seats in this row
        const rowAvailable = [];
        for (let c = 1; c <= 10; c++) {
          const sId = `${rowLabel}${c}`;
          if (!seatData.booked.includes(sId)) {
            rowAvailable.push(sId);
          }
        }

        if (rowAvailable.length >= qty) {
          setSelectedSeats(rowAvailable.slice(0, qty));
        } else {
          showToast(`Only ${rowAvailable.length} consecutive seats available in Row ${rowLabel}`, "warning");
          setSelectedSeats(rowAvailable);
        }
      };

      const getSeatTier = (rowLabel) => {
        const row = seatData.rows.find(r => r.label === rowLabel);
        return row ? row.tier : "STANDARD";
      };

      const ticketsSubtotal = useMemo(() => {
        return selectedSeats.reduce((acc, seatId) => {
          const rowLabel = seatId.charAt(0);
          const tierKey = getSeatTier(rowLabel);
          return acc + (SEAT_TIERS[tierKey] ? SEAT_TIERS[tierKey].price : 180);
        }, 0);
      }, [selectedSeats]);

      const snacksSubtotal = useMemo(() => {
        return Object.entries(selectedSnacks).reduce((acc, [snackId, qty]) => {
          const snack = SNACKS.find(s => s.id === snackId);
          return acc + (snack ? snack.price * qty : 0);
        }, 0);
      }, [selectedSnacks]);

      const subtotalBeforeDiscount = ticketsSubtotal + snacksSubtotal + convenienceFee;
      const discountAmount = subtotalBeforeDiscount * promoDiscount;

              </div>
            )}

            {/* ==================== 5. FAVORITES ==================== */}
            {currentView === "favorites" && (
              <div className="space-y-6 animate-in fade-in duration-300">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h2 className="font-heading font-extrabold text-2xl">Saved Favorites</h2>
                  <span className="text-xs text-brand-gold font-bold">{favorites.length} Movies Saved</span>
                </div>

                {favorites.length === 0 ? (
                  <div className="py-20 text-center space-y-3">
                    <h3 className="font-heading font-bold text-lg">No Favorites Saved</h3>
                    <p className="text-xs opacity-75">Click the save button on any movie card to store it here.</p>
                    <button onClick={goBackToHome} className="mt-2 px-5 py-2.5 rounded-xl bg-brand-gold text-black font-extrabold text-xs">
                      Browse Movies
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                    {MOVIES.filter(m => favorites.includes(m.id)).map(movie => (
                      <div 
                        key={movie.id}
                        onClick={() => openMovieDetails(movie)}
                        className={`group cursor-pointer rounded-20 overflow-hidden border transition-all ${
                          isDarkMode ? "bg-brand-card border-brand-border hover:border-brand-gold" : "bg-white border-slate-200"
                        }`}
                      >
                        <div className="relative aspect-[2/3] overflow-hidden bg-slate-900">
                          <img src={movie.poster} alt={movie.title} onError={handleImageError} className="w-full h-full object-cover" />
                        </div>
                        <div className="p-3 space-y-1">
                          <h4 className="font-heading font-bold text-xs group-hover:text-brand-gold line-clamp-1">{movie.title}</h4>
                          <p className="text-[10px] opacity-75">{movie.genre}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ==================== 6. PROFILE & TICKETS ==================== */}
            {currentView === "profile" && (
              <div className="space-y-8 animate-in fade-in duration-300 max-w-3xl mx-auto">
                <div className={`p-6 rounded-20 border flex items-center justify-between gap-5 ${
                  isDarkMode ? "bg-brand-card border-brand-border" : "bg-white border-slate-200 shadow-md"
                }`}>
                  <div className="flex items-center gap-4">
                    <CineVerseLogo size="lg" />
                    <div>
                      <h2 className="font-heading font-extrabold text-xl">
                        {userProfile ? userProfile.name : "Vasudev"}
                      </h2>
                      <div className="text-xs opacity-75 flex flex-wrap gap-3 mt-0.5">
                        <span>Age: {userProfile ? userProfile.age : "24"} yrs</span>
                        <span>•</span>
                        <span>Phone: {userProfile ? userProfile.phone : "9876543210"}</span>
                      </div>
                      <span className="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-brand-gold/20 text-brand-gold text-[10px] font-extrabold border border-brand-gold/40">
                        Gold Privilege Pass
                      </span>
                    </div>
                  </div>

                  <button 
                    onClick={() => setShowOnboardingModal(true)}
                    className="px-4 py-2 rounded-xl bg-brand-gold/15 text-brand-gold border border-brand-gold/30 text-xs font-bold hover:bg-brand-gold hover:text-black transition-colors"
                  >
                    Edit Profile
                  </button>
                </div>

                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="font-heading font-extrabold text-lg">Saved Booking Passes</h3>
                    <span className="text-xs text-brand-gold font-bold">{bookingHistory.length} Passes Active</span>
                  </div>
                  
                  {bookingHistory.length === 0 ? (
                    <p className="text-xs opacity-75 py-6 text-center">No active ticket bookings found.</p>
                  ) : (
                    <div className="space-y-3">
                      {bookingHistory.map(ticket => (
                        <div key={ticket.id} className={`p-4 rounded-20 border flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-all ${
                          isDarkMode ? "bg-brand-card border-brand-border" : "bg-white border-slate-200"
                        }`}>
                          <div className="flex items-center gap-3">
                            <div className="w-12 h-16 rounded-lg overflow-hidden flex-shrink-0">
                              <img src={ticket.poster} alt={ticket.movieTitle} onError={handleImageError} className="w-full h-full object-cover" />
                            </div>
                            <div>
                              <h4 className="font-heading font-bold text-sm">{ticket.movieTitle}</h4>
                              <p className="text-xs opacity-75">{ticket.theatre}</p>
                              <p className="text-xs text-brand-gold font-bold">{ticket.date} • {ticket.showtime}</p>
                              <p className="text-[10px] opacity-75">Seats: {ticket.seats.join(", ")}</p>
                            </div>
                          </div>
                          
                          <div className="flex sm:flex-col items-center sm:items-end justify-between gap-2 border-t sm:border-t-0 pt-2 sm:pt-0 border-white/10">
                            <span className="text-xs font-mono font-bold opacity-75">{ticket.id}</span>
                            <span className="text-xs font-extrabold text-brand-gold">₹{ticket.grandTotal}</span>
                            
                            <div className="flex items-center gap-2">
                              <button 
                                onClick={() => downloadTicketAsImage(ticket)}
                                className="px-3 py-1 rounded-lg bg-brand-gold/20 text-brand-gold border border-brand-gold/40 text-[10px] font-bold hover:bg-brand-gold hover:text-black transition-all"
                              >
                                Download
                              </button>
                              <button 
                                onClick={() => setRefundTargetTicket(ticket)}
                                className="px-3 py-1 rounded-lg bg-red-950/60 border border-red-500/40 text-red-300 text-[10px] font-bold hover:bg-red-600 hover:text-white transition-all"
                              >
                                Refund
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* CINEVERSE FOOTER WITH COPYRIGHT & VASUDEV CREDITS */}
            <footer className="mt-16 pt-8 border-t border-white/10 text-center space-y-2">
              <div className="flex items-center justify-center gap-2">
                <CineVerseLogo size="sm" />
                <span className="font-heading font-extrabold text-sm tracking-wider">
                  CINE<span className="text-brand-gold">VERSE</span>
                </span>
              </div>
              <p className="text-xs opacity-60">© 2026 CineVerse India. All rights reserved.</p>
              <p className="text-xs text-brand-gold font-bold tracking-wide">
                Designed & Developed with Passion by <span className="underline decoration-brand-gold">Vasudev</span> | OG's Cinema System
              </p>
            </footer>

          </main>

          {/* MOBILE BOTTOM NAVIGATION TAB BAR */}
          <nav className={`md:hidden fixed bottom-0 left-0 right-0 z-40 backdrop-blur-xl border-t px-6 py-2.5 transition-colors ${
            isDarkMode ? "bg-brand-black/95 border-brand-border" : "bg-white/95 border-slate-200 shadow-lg"
          }`}>
            <div className="flex items-center justify-around text-center">
              <button onClick={goBackToHome} className={`flex flex-col items-center gap-0.5 ${currentView === 'home' ? 'text-brand-gold font-bold' : 'opacity-60'}`}>
                <span className="text-xs font-black uppercase tracking-wider">HOME</span>
              </button>

              <button onClick={() => setCurrentView("search")} className={`flex flex-col items-center gap-0.5 ${currentView === 'search' ? 'text-brand-gold font-bold' : 'opacity-60'}`}>
                <span className="text-xs font-black uppercase tracking-wider">EXPLORE</span>
              </button>

              <button onClick={() => setCurrentView("favorites")} className={`flex flex-col items-center gap-0.5 relative ${currentView === 'favorites' ? 'text-brand-gold font-bold' : 'opacity-60'}`}>
                <span className="text-xs font-black uppercase tracking-wider">SAVED</span>
                {favorites.length > 0 && (
                  <span className="absolute -top-1 right-0 w-3.5 h-3.5 rounded-full bg-brand-gold text-black text-[9px] font-bold flex items-center justify-center">
                    {favorites.length}
                  </span>
                )}
              </button>

              <button onClick={() => setCurrentView("profile")} className={`flex flex-col items-center gap-0.5 ${currentView === 'profile' ? 'text-brand-gold font-bold' : 'opacity-60'}`}>
                <span className="text-xs font-black uppercase tracking-wider">PROFILE</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (ReactDOM.createRoot) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    } else {
      ReactDOM.render(<App />, rootElement);
    }
  </script>
</body>
</html>
